<script>
  let _newAvatarDataURL = null;
  let _legacyLocation = null;

  let _listTab = 'mine';
  let _allTrades = [];

  async function initProfile() {
    await restoreSession();
    if (!state.currentUser) { window.location.href = 'login.html'; return; }
    if (typeof startNotifListener === 'function') startNotifListener();
    await renderProfile();
    loadOfferCounts();
  }

  function _shortUid(u) { return 'G' + String(u.uid || u.id || '').replace(/[^a-z0-9]/gi, '').slice(0, 10).toUpperCase(); }

  function copyUid() {
    const txt = _shortUid(state.currentUser);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(() => showToast('UID copied'))
      .catch(() => showToast(txt));
  }

  function showVerifyInfo() {
    const u = state.currentUser;
    const m = { verified: 'Your account is verified ✅', pending: 'Your ID is waiting for admin review ⏳',
                rejected: 'Verification was rejected' + (u.rejectionReason ? ': ' + u.rejectionReason : '') };
    showToast(m[u.verificationStatus] || 'Not verified yet');
  }

  async function renderProfile() {
    const u = state.currentUser;
    const av = document.getElementById('profileAvatarEl');
    if (u.avatar) av.innerHTML = `<img src="${u.avatar}" alt="">`;
    else          av.textContent = u.name[0].toUpperCase();

    document.getElementById('profileNameEl').textContent = u.name;
    document.getElementById('profileUidEl').textContent  = 'UID: ' + _shortUid(u);

    const vs = u.verificationStatus;
    document.getElementById('profileVerifiedEl').style.display = vs === 'verified' ? 'inline-block' : 'none';
    const vv = document.getElementById('verifyVal');
    vv.textContent = vs === 'verified' ? 'Verified' : vs === 'pending' ? 'Pending review' : vs === 'rejected' ? 'Rejected' : 'Not verified';
    vv.style.color = vs === 'verified' ? '#4ade80' : vs === 'pending' ? '#f5a623' : vs === 'rejected' ? '#ff4d6d' : '';

    try {
      _allTrades = await apiGet('/trades/user/' + encodeURIComponent(u.email));
      state.trades = _allTrades;
      try {
        const snap = await firebase.firestore().collection('users').doc(u.uid).get();
        if (snap.exists) {
          const d = snap.data();
          document.getElementById('followVal').textContent = (d.followers || []).length + ' / ' + (d.following || []).length;
        }
      } catch (_) {}
      try {
        if (typeof getUserRatingSummary === 'function') {
          const r = await getUserRatingSummary(u.uid);
          if (r.count) document.getElementById('ratingVal').textContent = '⭐ ' + r.avg.toFixed(1) + ' (' + r.count + ')';
        }
      } catch (_) {}
    } catch (_) {}
    renderMyTrades();
  }

  // Red badges on the status tiles (pending / in-progress counts)
  async function loadOfferCounts() {
    try {
      const [recv, sent] = await Promise.all([loadOffersReceived(), loadOffersSent()]);
      const set = (id, n) => { const el = document.getElementById(id); if (el && n) { el.textContent = n > 9 ? '9+' : n; el.style.display = 'flex'; } };
      set('bdgSentPending', sent.filter(o => o.status === 'pending' || o.status === 'countered').length);
      set('bdgSentProg',    sent.filter(o => o.status === 'accepted').length);
      set('bdgRecvPending', recv.filter(o => o.status === 'pending').length);
      set('bdgRecvProg',    recv.filter(o => o.status === 'accepted').length);
    } catch (_) {}
  }

  async function setListTab(tab) {
    _listTab = tab;
    document.querySelectorAll('.my-quick button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    document.getElementById('listTitle').textContent = { mine: 'My Listings', liked: 'Liked', history: 'Browsing history' }[tab];
    if ((tab === 'liked' || tab === 'history') && !state._allLoaded) {
      try { await loadTrades(); state._allLoaded = true; } catch (_) {}
    }
    renderMyTrades();
    document.getElementById('myList').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderMyTrades() {
    let list = [], empty = '';
    if (_listTab === 'mine') {
      list = _allTrades;
      empty = `You haven't posted any trades yet.<br><a href="post-trade.html" style="color:var(--accent-cyan)">Create your first post →</a>`;
    } else if (_listTab === 'liked') {
      list = state.trades.filter(t => t.likedByMe);
      empty = 'Trades you like will show up here.';
    } else {
      let ids = []; try { ids = JSON.parse(localStorage.getItem('gbh_history') || '[]'); } catch (_) {}
      list = ids.map(id => state.trades.find(t => t.id === id)).filter(Boolean);
      empty = 'Trades you open will show up here.';
    }
    document.getElementById('myTradesGrid').innerHTML = list.length
      ? list.map(t => tradeCardHTML(t, _listTab === 'mine')).join('')
      : `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">📦</div><p>${empty}</p></div>`;
  }

  // ── Location helpers ──────────────────────────
  // New saves are stored as "City, Province". Older accounts only stored the
  // city, so we try to work the province out from the PSGC list when it's
  // unambiguous (e.g. "Olongapo City" → Zambales).
  function _parseLocation(loc) {
    loc = (loc || '').trim();
    if (!loc) return { city: '', province: '', full: '' };
    const parts = loc.split(',').map(s => s.trim()).filter(Boolean);
    const city = parts[0] || '';
    let province = '';
    if (parts[1] && PH_LOCATIONS[parts[1]] && PH_LOCATIONS[parts[1]].includes(city)) {
      province = parts[1];
    } else {
      const hits = Object.keys(PH_LOCATIONS).filter(p => PH_LOCATIONS[p].includes(city));
      if (hits.length === 1) province = hits[0];
    }
    const known = province && PH_LOCATIONS[province].includes(city);
    const full = known ? city + ', ' + province + ', Philippines' : loc;
    return { city: known ? city : '', province: known ? province : '', full };
  }

  function _formatPhone(p) {
    const d = String(p || '').replace(/\D/g, '');
    return d.length === 11 ? d.slice(0, 4) + ' ' + d.slice(4, 7) + ' ' + d.slice(7) : (p || '');
  }

  function onEditStateChange() {
    populatePHLocations(document.getElementById('editState').value, document.getElementById('editCity'));
  }

  function renderAccountDetails() {
    const u = state.currentUser;
    const loc = _parseLocation(u.location);
    document.getElementById('acctLoc').textContent   = loc.full || 'Not set';
    document.getElementById('acctPhone').textContent = _formatPhone(u.phone) || 'Not set';
    document.getElementById('acctEmail').textContent = u.email || 'Not set';
  }

  function showEditModal() {
    const u = state.currentUser;
    _newAvatarDataURL = null;
    document.getElementById('editName').value = u.name;

    renderAccountDetails();
    const loc = _parseLocation(u.location);
    _legacyLocation = (u.location && !loc.city) ? u.location : null; // free-text value we can't map to a dropdown
    populatePHStates(document.getElementById('editState'));
    document.getElementById('editState').value = loc.province;
    populatePHLocations(loc.province, document.getElementById('editCity'));
    document.getElementById('editCity').value = loc.city;

    const prev = document.getElementById('editAvatarPreview');
    if (u.avatar) prev.innerHTML = `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover" alt="">`;
    else          prev.textContent = u.name[0].toUpperCase();

    document.getElementById('editModalOverlay').classList.add('open');
  }

  function previewEditAvatar(input) {
    if (!input.files[0]) return;
    const r = new FileReader();
    r.onload = e => {
      _newAvatarDataURL = e.target.result;
      const prev = document.getElementById('editAvatarPreview');
      prev.innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover" alt="">`;
    };
    r.readAsDataURL(input.files[0]);
  }

  function closeEditModal(e) {
    if (e && e.target !== document.getElementById('editModalOverlay')) return;
    document.getElementById('editModalOverlay').classList.remove('open');
  }

  async function saveProfile() {
    const name = document.getElementById('editName').value.trim();
    const prov = document.getElementById('editState').value;
    const city = document.getElementById('editCity').value;
    if (!name) { showToast('Name cannot be empty', 'error'); return; }
    if (prov && !city) { showToast('Please select your city / municipality', 'error'); return; }
    // "City, Province"; keep an old free-text location untouched if nothing new was picked
    const loc = city ? city + ', ' + prov : (_legacyLocation || '');

    try {
      const { user } = await apiPut('/auth/profile', {
        name, location: loc,
        avatar: _newAvatarDataURL || state.currentUser.avatar || null,
      });
      state.currentUser = user;
      document.getElementById('editModalOverlay').classList.remove('open');
      showToast('✅ Profile updated!');
      renderProfile();
      updateNavUser();
      _newAvatarDataURL = null;
    } catch (e) {
      showToast(e.message || 'Could not save profile.', 'error');
    }
  }

  // ── Change password ───────────────────────────
  function showPasswordModal() {
    ['pwCurrent', 'pwNew', 'pwConfirm'].forEach(id => { const el = document.getElementById(id); el.value = ''; el.type = 'password'; });
    document.querySelector('#pwModalOverlay .pw-show input').checked = false;
    document.getElementById('pwError').style.display = 'none';
    document.getElementById('pwModalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('pwCurrent').focus(), 150);
  }

  function closePasswordModal(e) {
    if (e && e.target !== document.getElementById('pwModalOverlay')) return;
    document.getElementById('pwModalOverlay').classList.remove('open');
  }

  function togglePwVisibility(show) {
    ['pwCurrent', 'pwNew', 'pwConfirm'].forEach(id => { document.getElementById(id).type = show ? 'text' : 'password'; });
  }

  async function submitPasswordChange() {
    const err     = document.getElementById('pwError');
    const btn     = document.getElementById('pwSubmitBtn');
    const current = document.getElementById('pwCurrent').value;
    const next    = document.getElementById('pwNew').value;
    const confirm = document.getElementById('pwConfirm').value;
    err.style.display = 'none';

    if (!current || !next || !confirm) return showErr(err, 'Please fill in all fields.');
    if (next.length < 6)               return showErr(err, 'New password must be at least 6 characters.');
    if (next !== confirm)              return showErr(err, 'New passwords do not match.');
    if (next === current)              return showErr(err, 'New password must be different from your current password.');

    btn.disabled = true; btn.textContent = 'Updating…';
    try {
      await changePassword(current, next);
      document.getElementById('pwModalOverlay').classList.remove('open');
      showToast('✅ Password updated!');
    } catch (e) {
      const c = (e && e.code) || '';
      let msg = e.message || 'Could not change password.';
      if (c === 'auth/wrong-password' || c === 'auth/invalid-credential' || c === 'auth/invalid-login-credentials')
        msg = 'Your current password is incorrect.';
      else if (c === 'auth/weak-password')            msg = 'New password is too weak. Use at least 6 characters.';
      else if (c === 'auth/too-many-requests')        msg = 'Too many attempts. Please wait a few minutes and try again.';
      else if (c === 'auth/network-request-failed')   msg = 'Network error. Check your connection and try again.';
      else if (c === 'auth/requires-recent-login')    msg = 'Please log out and log back in, then try again.';
      showErr(err, msg);
    } finally {
      btn.disabled = false; btn.textContent = 'Update Password';
    }
  }

  initProfile();
</script>
</body>
</html>
